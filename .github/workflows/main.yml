name: Complete CI/CD Learning Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      name:
        description: 'User Name'
        required: false
        default: 'Student'

jobs:
  main-learning-job:
    name: Main Learning Job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Current Directory
        run: |
          echo "Current Directory:"
          pwd
          echo "Full Path: $(pwd)"

      - name: List Files
        run: |
          echo "Repository Files:"
          ls -la
          echo "File Count: $(ls -1 | wc -l)"

      - name: Create Directory
        run: |
          mkdir -p my_github_actions_directory
          echo "Directory created successfully"
          ls -ld my_github_actions_directory

      - name: Learning Message
        run: |
          echo "I am learning GitHub Actions"

  verification-job:
    name: Verification Job
    runs-on: ubuntu-latest
    needs: main-learning-job
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Workflow Execution
        run: |
          echo "Workflow Verification"
          echo "Event: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Runner OS: ${{ runner.os }}"

      - name: Execution Summary
        run: |
          echo "Pipeline Completed Successfully"
          echo "Current Directory Displayed"
          echo "Files Listed"
          echo "Directory Created"
          echo "Learning Message Printed"

  environment-info:
    name: Environment Information
    runs-on: ubuntu-latest
    needs: main-learning-job
    steps:
      - name: Display Environment Details
        run: |
          echo "Runner OS: ${{ runner.os }}"
          echo "Architecture: ${{ runner.arch }}"
          echo "Workspace: ${{ github.workspace }}"
          echo "Job ID: ${{ github.job }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
